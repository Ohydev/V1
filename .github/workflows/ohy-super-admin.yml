name: OHY-SUPER-ADMIN CI

on:
  push:
    branches: [main]
    paths:
      - "OHY-SUPER-ADMIN/**"
  pull_request:
    paths:
      - "OHY-SUPER-ADMIN/**"

jobs:
  build:
    name: Lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHY-SUPER-ADMIN

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: OHY-SUPER-ADMIN/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
