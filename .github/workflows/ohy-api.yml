name: OHY-API CI

on:
  push:
    branches: [main]
    paths:
      - "OHY-API/**"
  pull_request:
    paths:
      - "OHY-API/**"

jobs:
  test:
    name: Format check + migrations + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHY-API

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ohy_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Match the production image (OHY-API/Dockerfile) and local dev.
          # config/database.php uses \Pdo\Mysql, which needs PHP 8.4+.
          php-version: "8.5"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=testing
          APP_KEY=
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=ohy_testing
          DB_USERNAME=root
          DB_PASSWORD=
          EOF

      - name: Generate app key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check code style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Run test suite
        run: php artisan test
